<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel Sliders in Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>
<body>
    <!-- Basic Carousel Structure -->
     <div id="carouselExample" class="carousel slide" 
     data-bs-ride="carousel">
     <div class="carousel-inner">
        <div class="carousel-item acitve">
            <img src="boy.jpg" class="d-block w-100" 
            alt="Slide 1">
        </div>

        <div class="carousel-item">
            <img src="cars3.jpg" class="d-block w-100" 
            alt="Slide 2">
        </div>
        
     </div>

     </div>

     <!-- Carousal Captions -->
      <div class="carousel-item acitve">
        <img src="chef.jpg" class="d-block w-100" 
        alt="Slide 1">
        <div class="carousel-caption d-none d-md-block">
            <h5>Slide Title</h5>
            <p>Slide description text.</p>
        </div>
      </div>


      <!-- Carousel Controls -->
       <button class="carousel-control-prev" type="button" 
       data-bs-target="#carouselExample" 
       data-bs-slide="prev">
        <span class="carousel-control-prev-icon" 
        aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
       </button>

       <button class="carousel-control-next" type="button" 
       data-bs-target="#carouselExample" 
       data-bs-slide="next">
        <span class="carousel-control-next-icon" 
        aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
       </button>


       <!-- Indicators (Dots) -->



     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
