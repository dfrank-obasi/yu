<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            min-height: 100vh;
            background: #0f172a;
            color: white;
            overflow: hidden;
        }

        .animated-bg {
            position: fixed;
            inset: 0;
            background: linear-gradient(2700deg, #6366f1, #22c55e, #ec4899);
            background-size: 600% 600%;
            animation: gradientMove 5s ease infinte;
            z-index: -1;
        }

        @keyframes gradientMove {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 30px;
            justify-content: center;
            align-items: center;
        }

        .fade-in {
            animation: fadeIn 1.5s ease forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            background: #22c55e;
            color: #000;
            cursor: pointer;
            border-radius: 6px;

            transition: 
            background 0.3s ease,
            transform 0.3s ease,
            box-shadow 0.3s ease;
        }

        .btn:hover {
            background: #16a34a;
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba (0,0,0,0.3);
        }

        .card {
            width: 260px;
            padding: 20px;
            background: rgba (255,255,255,0.1);
            border-radius: 10px;
            text-align: center;
        }

        .slide-in {
            animation: slide-in 1s ease forwards;
        }

        @keyframes slide-in {
            from {opacity: 0;
            transform: translateX(-100px); }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba (255, 255, 255, 0.2);
            border-top: 5px solid white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {transform: rotate(360deg);}
        }
    </style>
</head>
<body>
    <!-- Background animation -->
     <div class="animated-bg"></div>
     <main class="container">
        <h1 class="fade-in">CSS Animation Demo</h1>

        <!-- Transition example -->
         <button class="btn">Hover Me</button>

         <!-- Transform animation -->
          <div class="card slide-in">
            <h3>Animated Card</h3>
            <p>This card slides in using keyframes.
            </p>
          </div>

          <!-- Infinite animation -->
           <div class="loader"></div>
     </main>
</body>
</html>
