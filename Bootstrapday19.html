<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinners & Progress Bars in Bootstrap</title>
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>
<body>
    <!-- Spinner Types -->
     <!-- Border spinner -->
     <div class="spinner-border mb-3" role="status">
        <span class="visually-hidden">Loading...</span>
     </div>

     <!-- Grow spinner -->
      <div class="spinner-grow text-primary mt-3" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>

      <!-- Spinner Sizes and Colors -->
       Sizes: spinner-border-sm(Small)
       Color: text-primary, text-success etc...
       <div class="spinner-border text-success mb-3" role="status">
        <span>Loading</span>
       </div>

       <div class="spinner-grow text-danger spinner-grow-sm mb-3" role="status">
        <span>Loading</span>
       </div>

       <!-- Spinner Inside Buttons -->
        Combine spinner with buttons to indicate loading state.
        <button class="btn btn-primary mb-3" type="button" disabled>
            <span class="spinner-border
            spinner-border-sm me-2" role="status"></span>Loading
        </button>

        <!-- Basic Progress Bars -->
         <div class="progress mb-3">
            <div class="progress-bar" role="progressbar"
            style="width: 50%;" aria-valuenow="50"
            aria-valuemin="0" aria-valuemax="100"></div>
         </div>

         <!-- Progress Bar Colors -->
          <div class="progress mb-2">
            <div class="progress-bar bg-success" 
            style="width: 40%;"></div>
          </div>

          <div class="progress mb-2">
            <div class="progress-bar bg-danger" 
            style="width: 60%;"></div>
          </div>

          <!-- Progress Bar with Labels -->
           <!-- Add text inside the progress bar: -->
            <div class="progress mb-3">
                <div class="progress-bar" role="progressbar"
                style="width: 70%;">70%</div>
            </div>

            <!-- Striped & Animated Progress -->
             Striped:
             <div class="progress">
                <div class="progress-bar progress-bar-striped bg-info"
                 style="width: 50%;"></div>
             </div>

             Animated:
             <div class="progress">
                <div class="progress-bar progress-bar-striped
                progress-bar-animated bg-warning"
                 style="width: 60%;"></div>
             </div>

             <!-- Full Working Example -->
              <div class="container py-5">

                <h3>Spinner</h3>
                <div class="mb-3">
                    <div class="spinner-border text-primary me-2" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>

                    <div class="spinner-grow text-success
                    spinner-grow-sm" role="status">
                        <span class="visually-hidden">Loading</span>
                    </div>

                </div>

                <button class="btn btn-primary mb-4" type="button" disabled>
                    <span class="spinner-border spinner-border-sm
                    me-2" role="status"></span>Loading...
                </button>

                <h3>Progress Bars</h3>
                <div class="progress mb-2">
                    <div class="progress-bar bg-success" 
                    style="width: 40%;">
                        40%
                    </div>
                </div>

                <div class="progress mb-2">
                    <div class="progress-bar bg-danger progress-bar-striped" 
                    style="width: 60%;">
                        60%
                    </div>
                </div>

                <div class="progress mb-2">
                    <div class="progress-bar bg-success progress-bar-striped
                    progress-bar-animated" 
                    style="width: 70%;">
                        70%
                    </div>
                 </div>

              </div>


     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
