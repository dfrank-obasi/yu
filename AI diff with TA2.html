<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            border: 5px solid saddlebrown;
            width: 30%;
            height: 500px;
            background: powderblue;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .items {
            border: 2px solid seagreen;
            width: 80px;
            margin: 3px;
            padding: 10px 10px;
            background: chartreuse;
            flex-wrap: nowrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items">Items One</div>
        <div class="items">Items Two</div>
        <div class="items">Items Two</div>
    </div>
</body>
</html>
