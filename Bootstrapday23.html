<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Groups & Floating Label in Bootstrap</title>
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>
<body>
    <!-- Basic Input Group -->
     <div class="input-group mb-3">
        <span class="input-group-text">@</span>
        <input type="text" class="form-control" 
        placeholder="username">
     </div>

     <!-- Input Group with Text Prefix/Suffix -->
      <div class="input-group mb-3">
        <span class="input-group-text">$</span>
        <input type="number" class="form-control" 
        placeholder="Amount">
        <span class="input-group-text">.00</span>
      </div>
      <!-- Prefix $ and Suffix .00 for currency formatting -->


      <!-- Input Group with Buttons -->
       <div class="input-group mb-3">
        <button class="btn btn-outline-secondary" 
        type="button">Go</button>
        <input type="text" class="form-control" 
        placeholder="Search">
        
       </div>
       <!-- NB: Buttons can appear at the end or start of input group -->


       <!-- Multiple Inputs in a Group -->
        <div class="input-group mb-3">
            <span class="input-group-text">First & Last</span>
            <input type="text" class="form-control" 
            placeholder="First name">
            <input type="text" class="form-control" 
            placeholder="Last name">
        </div>
        <!-- Nb:Combines mutiple inputs into one cohesive row -->


        <!-- Floating Labels.... -->
         <div class="form-floating mb-3">
            <input type="email" class="form-control" 
            id="floatingEmail" placeholder="name@example.com">
            <label for="floatingEmail">Email Address</label>
         </div>


         <!-- Floating Labels with Different Input Types -->
          <div class="form-floating mb-3">
            <input type="password" class="form-control" 
            placeholder="Password" 
            id="floatingPassword">
            <label for="floatingPassword">Password</label>
          </div>

          <div class="form-floating mb-3">
            <textarea class="form-control" 
            placeholder="Leave a comment" 
            id="floatingTextarea"></textarea>
            <label for="floatingTextarea">Comments</label>
          </div>


          <!-- Input Group Sizing -->
           <div class="input-group input-group-sm mb-3">
            <span class="input-group-text">Small</span>
            <input type="text" class="form-control">
           </div>

           <div class="input-group input-group-lg mb-3">
            <span class="input-group-text">Large</span>
            <input type="text" class="form-control">
           </div>


           <!-- Full Working Example -->
            <div class="container py-5">

                <h3>Basic Input Group</h3>
                <div class="input-group mb-3">
                    <span class="input-group-text">@</span>
                    <input type="text" class="form-control" 
                    placeholder="Username">
                </div>

                <h3>Input Group with Prefix/Suffix</h3>
                <div class="input-group mb-3">
                    <span class="input-group-text">$</span>
                    <input type="number" class="form-control" 
                    placeholder="Amount">
                    <span class="input-group-text">.00</span>
                </div>

                <h3>Input Group with Button</h3>
                <div class="input-group mb-3">
                    <input type="text" class="form-control" 
                    placeholder="Search">
                    <button type="button" class="btn btn-outline-secondary">Go</button>
                </div>

                <h3>Floating Label</h3>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" 
                    id="floatingEmail" placeholder="name@example.com">
                    <label for="floatingEmail">Email address</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" 
                    id="floatingPassword" placeholder="Password">
                    <label for="floatingPassword">Password</label>
                </div>

                <div class="form-floating">
                    <textarea class="form-control" 
                    placeholder="Leave a comment" 
                    id="floatingTextarea"></textarea>
                    <label for="floatingTextarea">Comments</label>
                </div>

            </div>



     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
