<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        .spinner {
            background: goldenrod;
            width: 250px;
            height: 100px;
            border-radius: 50%;
            border-top: #4f46e5;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
            
        }
    </style>
</head>
<body>
   <div class="spinner"></div> 
</body>
</html>
