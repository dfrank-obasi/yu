<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
       body {
         background: #020617;
         color: white;
         height: 100vh;
         display: grid;
         place-items: center;
         font-family: system-ui, sans-serif;
       }
       .wrapper {
        width: 400px;
       }
       .row {
        margin-bottom: 1.5rem;
       }
       span {
        display: block;
        margin-bottom: 0;
        font-size: 0.9rem;
       }
       .bar {
        height: 12px;
        background: #2563eb;
        width: 0%;
        border-radius: 999px;

        transition-property: width;
        transition-duration: 1.5s;
       }

       .linear {
        transition-timing-function: linear;
       }
       .ease-out {
        transition-timing-function: ease-out;
       }
       .ease-in-out {
        transition-timing-function: ease-in-out;
       }
       .custom {
        transition-timing-function: 
        cubic-bezier(0.4, 0, 0.2, 1);
       }

       /* Trigger Animation */
       .wrapper:hover .bar {
          width: 100%;
       }
    </style>
</head>
<body>
  <div class="wrapper">
    <div class="row">
        <span>Linear</span>
        <div class="bar linear"></div>
    </div>

    <div class="row">
        <span>Ease-out</span>
        <div class="bar ease-out"></div>
    </div>

    <div class="row">
        <span>Ease-in-out</span>
        <div class="bar ease-in-out"></div>
    </div>

    <div class="row">
        <span>Cubic-bezier</span>
        <div class="bar custom"></div>
    </div>
  </div>
</body>
</html>
